name: Express.js CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

# Hủy các build đang chạy trước đó nếu có commit mới được push lên cùng branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test & Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    env:
      NODE_ENV: test
      PORT: 3000
      JWT_SECRET: test_jwt_access_secret_key_ci_environment_example_123456
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_ci_environment_example_123456

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cài đặt Dependencies
        run: npm ci

      - name: Kiểm tra cú pháp toàn bộ mã nguồn (Syntax & Import Check)
        run: |
          node --check server.js
          node --check bin/www
          npm run check
          node --input-type=module -e "await import('./src/app.js'); await import('./src/services/push.service.js'); await import('./src/services/pdf.service.js'); await import('./src/middlewares/idempotency.middleware.js'); console.log('All backend modules loaded cleanly.');"

      - name: Chạy Linter (nếu có script "lint")
        run: npm run --if-present lint

      - name: Chạy Unit/Integration Tests (khi có schema SQL)
        run: |
          if [ -f credit_health_db.sql ]; then
            npm test --if-present
          else
            echo "Skipping DB integration tests: credit_health_db.sql is not tracked in git."
          fi

      - name: Build ứng dụng (nếu có script "build")
        run: npm run --if-present build

      - name: Kiểm tra bảo mật gói thư viện (Security Audit)
        run: npm audit --audit-level=high
        continue-on-error: true

