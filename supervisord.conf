[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/bin/sh -c 'export PORT="${PORT:-80}"; envsubst "\${PORT}" < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec /usr/sbin/nginx -g "daemon off;"'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:backend]
directory=/app
environment=PORT="3000",HOST="127.0.0.1"
command=/bin/sh -c "npm run db:migrate && npm start"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
